name: Feature Branch CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: feature-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate feature branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Maven project metadata
        run: mvn -B -f pom.xml verify

      - name: Compile each chapter's Java examples
        shell: bash
        run: |
          set -euo pipefail
          total=0
          failed=0
          output_root="$RUNNER_TEMP/chapter-java-classes"
          mkdir -p "$output_root"
          failure_summary="$output_root/failures.txt"
          : > "$failure_summary"

          while IFS= read -r -d '' source; do
            total=$((total + 1))
            relative="${source#./}"
            safe_name="$(printf '%s' "$relative" | tr '/ ' '__')"
            work_dir="$output_root/$total"
            mkdir -p "$work_dir/classes"

            # Examples are independent snippets and can reuse class names
            # across files. Compile each source in isolation to avoid collisions.
            public_type="$(sed -nE 's/^[[:space:]]*public[[:space:]]+(abstract[[:space:]]+|final[[:space:]]+)?(class|interface|enum|record)[[:space:]]+([A-Za-z_$][A-Za-z0-9_$]*).*/\3/p' "$source" | head -n 1)"
            if [[ -n "$public_type" ]]; then
              compile_source="$work_dir/$public_type.java"
            else
              compile_source="$work_dir/$(basename "$source")"
            fi
            cp "$source" "$compile_source"

            echo "::group::Compile $relative"
            if compiler_output="$(javac --release 21 -d "$work_dir/classes" "$compile_source" 2>&1)"; then
              echo "PASS: $relative"
            else
              echo "FAIL: $relative" >&2
              failed=$((failed + 1))
              {
                echo
                echo "FILE: $relative"
                echo "$compiler_output" | sed "s#${compile_source}:#${relative}:#g"
              } >> "$failure_summary"

              # Emit annotations with the original repository path and source line.
              while IFS= read -r diagnostic; do
                translated="$(printf '%s' "$diagnostic" | sed "s#${compile_source}:#${relative}:#g")"
                echo "$translated" >&2
                if [[ "$translated" =~ ^(.+):([0-9]+):[[:space:]]error:[[:space:]](.*)$ ]]; then
                  error_file="${BASH_REMATCH[1]}"
                  error_line="${BASH_REMATCH[2]}"
                  error_message="${BASH_REMATCH[3]}"
                  echo "::error file=$error_file,line=$error_line,title=Java compilation error::$error_message"
                fi
              done <<< "$compiler_output"
            fi
            echo "::endgroup::"
          done < <(find . -type f -name '*.java' -not -path '*/.git/*' -not -path '*/target/*' -print0)

          echo "Checked $total Java examples; $failed failed."
          if ((failed > 0)); then
            echo
            echo "========== JAVA COMPILATION FAILURE SUMMARY =========="
            cat "$failure_summary"
            echo "======================================================"
          fi
          if ((total == 0 || failed > 0)); then
            exit 1
          fi

      - name: Check patch whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          else
            git diff --check
          fi
