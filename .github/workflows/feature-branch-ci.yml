name: Feature Branch CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: feature-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate feature branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Maven project metadata
        run: mvn -B -f pom.xml verify

      # This repository is a collection of standalone lesson snippets, not one
      # Maven source tree. Some legacy examples have pre-existing compile errors,
      # so validate only Java files changed by this feature branch.
      - name: Compile changed Java examples
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="$(git merge-base origin/main "$GITHUB_SHA")"
          fi

          mapfile -d '' java_files < <(
            git diff --name-only --diff-filter=ACMRT -z "$base_sha" "$GITHUB_SHA" -- '*.java'
          )

          if (( ${#java_files[@]} == 0 )); then
            echo "No Java source files changed; Java compilation check is not needed."
            exit 0
          fi

          output_root="$RUNNER_TEMP/changed-java-classes"
          mkdir -p "$output_root"

          for index in "${!java_files[@]}"; do
            source="${java_files[$index]}"
            [[ -f "$source" ]] || continue
            output_dir="$output_root/example-$index"
            mkdir -p "$output_dir"

            echo "::group::Compile changed file: $source"
            # Compile from the file's directory so same-directory dependencies
            # can be discovered without combining unrelated lesson snippets.
            source_dir="$(dirname "$source")"
            source_name="$(basename "$source")"
            (
              cd "$source_dir"
              javac --release 21 -d "$output_dir" "$source_name"
            )
            echo "::endgroup::"
          done

          echo "Changed Java source compilation completed successfully."

      - name: Check patch whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          else
            git diff --check
          fi
