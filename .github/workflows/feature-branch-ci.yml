name: Feature Branch CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: feature-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate feature branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Maven project metadata
        run: mvn -B -f pom.xml verify

      - name: Compile each chapter's Java examples
        shell: bash
        run: |
          set -euo pipefail
          compiled=0
          output_root="$RUNNER_TEMP/java-chapter-classes"
          mkdir -p "$output_root"

          while IFS= read -r -d '' code_dir; do
            mapfile -d '' sources < <(find "$code_dir" -maxdepth 1 -type f -name '*.java' -print0)
            if (("${#sources[@]}" == 0)); then
              continue
            fi

            compiled=$((compiled + 1))
            output_dir="$output_root/chapter-$compiled"
            mkdir -p "$output_dir"
            echo "::group::Compile Java examples in $code_dir"
            javac --release 21 -d "$output_dir" "${sources[@]}"
            echo "::endgroup::"
          done < <(find . -type d -name code -not -path '*/.git/*' -print0)

          if ((compiled == 0)); then
            echo "No Java source files were found in chapter code directories." >&2
            exit 1
          fi

          echo "Successfully compiled Java sources in $compiled chapter code directories."

      - name: Check patch whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          else
            git diff --check
          fi
