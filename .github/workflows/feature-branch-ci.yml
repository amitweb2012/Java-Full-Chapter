name: Feature Branch CI

on:
  pull_request:
    branches:
      - main
      types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: feature-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate feature branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Maven project metadata
        run: mvn -B -f pom.xml verify

      - name: Compile Java examples independently
        shell: bash
        run: |
          set -euo pipefail
          compiled=0
          output_root="$RUNNER_TEMP/java-chapter-classes"
          mkdir -p "$output_root"

          while IFS= read -r -d '' source; do
            compiled=$((compiled + 1))
            output_dir="$output_root/example-$compiled"
            mkdir -p "$output_dir"
            echo "::group::Compile $source"
            javac --release 21 -d "$output_dir" "$source"
            echo "::endgroup::"
          done < <(find . -type f -name '*.java' -not -path '*/.git/*' -not -path '*/target/*' -print0)

          if ((compiled == 0)); then
            echo "No Java source files were found." >&2
            exit 1
          fi

          echo "Successfully compiled $compiled Java source files."

      - name: Check patch whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          else
            git diff --check
          fi
